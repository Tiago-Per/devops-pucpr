name: Discord
on:
  - push

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Run Discord webhook
      uses: Sniddl/discord-commits@v1.6
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        template: "avatar-with-link"
        include-extras: true